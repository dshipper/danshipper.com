<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Signifier";
    src: url("../site/fonts/signifier-light.woff2") format("woff2");
    font-weight: 300;
  }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    font-family: "Signifier", Georgia, serif;
    font-weight: 300;
    color: #222222;
    position: relative;
    box-sizing: border-box;
    padding: 80px 90px;
    border-bottom: 14px solid #0599ff;
  }
  .name {
    font-size: 112px;
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1;
    margin-top: 110px;
  }
  .tag {
    font-size: 34px;
    font-weight: 300;
    color: #474747;
    margin-top: 30px;
    line-height: 1.35;
  }
  .tag em { color: #0599ff; font-style: normal; }
  .url {
    position: absolute;
    bottom: 56px;
    left: 90px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: #0599ff;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="name">Dan Shipper</div>
  <div class="tag">Co-founder &amp; CEO of Every. Writes <em>Chain of Thought</em>, hosts <em>AI &amp; I</em>.</div>
  <div class="url">danshipper.com</div>
</div>
</body>
</html>
