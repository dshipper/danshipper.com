<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Newsreader";
    src: url("../site/fonts/newsreader-roman-v2.woff2") format("woff2");
    font-weight: 200 800;
  }
  @font-face {
    font-family: "Newsreader";
    src: url("../site/fonts/newsreader-italic-v2.woff2") format("woff2");
    font-weight: 200 800;
    font-style: italic;
  }
  html, body { margin: 0; padding: 0; }
  .card {
    width: 1200px;
    height: 630px;
    background: #fbf9f4;
    font-family: "Newsreader", Georgia, serif;
    color: #1c1a17;
    position: relative;
    box-sizing: border-box;
    padding: 80px 90px;
    border-bottom: 14px solid #963421;
  }
  .name {
    font-size: 110px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1;
    margin-top: 110px;
  }
  .tag {
    font-size: 34px;
    color: #6e675c;
    margin-top: 28px;
    line-height: 1.35;
  }
  .tag em { color: #963421; }
  .url {
    position: absolute;
    bottom: 56px;
    left: 90px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: #963421;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="card">
  <div class="name">Dan Shipper</div>
  <div class="tag">Co-founder &amp; CEO of Every. Writes <em>Chain of Thought</em>, hosts <em>AI &amp; I</em>.</div>
  <div class="url">danshipper.com</div>
</div>
</body>
</html>
